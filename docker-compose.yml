# Levanta El Gerente en local con PostgreSQL (el mismo motor que usará la nube).
#
#   cp .env.docker.example .env.docker   # y ajustar la clave si se quiere
#   docker compose up --build
#
# Luego:  http://localhost:8000/        (interfaz gráfica)
#         http://localhost:8000/docs    (API)
#
# Para una prueba rápida SIN PostgreSQL, no hace falta Docker: ver backend/README.md
# (uvicorn directo sobre SQLite).

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: elgerente
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-elgerente}
      POSTGRES_DB: elgerente
    volumes:
      - datos_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elgerente -d elgerente"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://elgerente:${POSTGRES_PASSWORD:-elgerente}@db:5432/elgerente
      ENTORNO: prod
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/salud').status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  datos_db:
